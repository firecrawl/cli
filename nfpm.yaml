name: firecrawl
description: CLI for Firecrawl, the context API for AI agents. Search, scrape, parse, crawl, map, and interact with the web, and search research papers.
homepage: https://firecrawl.dev
maintainer: Firecrawl <support@firecrawl.dev>
license: ISC
vendor: Firecrawl
version: ${VERSION}
arch: ${ARCH}

contents:
  - src: ${BINARY}
    dst: /usr/bin/firecrawl
    file_info:
      mode: 0755
