name: Release Binaries

on:
  push:
    branches: [main, install-sh]
    paths:
      - 'package.json'
      - '.github/workflows/release-binaries.yml'
      - 'nfpm.yaml'
  workflow_dispatch:

permissions: {}

jobs:
  check-version:
    runs-on: ubuntu-latest
    name: Check for version bump
    permissions:
      contents: read
    outputs:
      version: ${{ steps.check.outputs.version }}
      released: ${{ steps.check.outputs.released }}
      dry_run: ${{ steps.check.outputs.dry_run }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check if version tag exists
        id: check
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          # Dry run on non-main branches
          if [[ "$VERSION" == *"-alexandria"* ]]; then
            echo "dry_run=true" >> "$GITHUB_OUTPUT"
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "Alexandria is npm-only; skipping binary releases"
          elif [ "${{ github.ref_name }}" != "main" ]; then
            echo "dry_run=true" >> "$GITHUB_OUTPUT"
            echo "released=false" >> "$GITHUB_OUTPUT"
            echo "Dry run on branch ${{ github.ref_name }} — will build but not release"
          elif git rev-parse "v$VERSION" >/dev/null 2>&1; then
            echo "dry_run=false" >> "$GITHUB_OUTPUT"
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "v$VERSION already released — skipping"
          else
            echo "dry_run=false" >> "$GITHUB_OUTPUT"
            echo "released=false" >> "$GITHUB_OUTPUT"
            echo "New version detected: v$VERSION"
          fi

  build:
    needs: check-version
    if: needs.check-version.outputs.released == 'false'
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: bun-linux-x64
            binary: firecrawl-linux-x64
          - os: ubuntu-latest
            target: bun-linux-arm64
            binary: firecrawl-linux-arm64
          - os: macos-latest
            target: bun-darwin-arm64
            binary: firecrawl-darwin-arm64
          - os: macos-latest
            target: bun-darwin-x64
            binary: firecrawl-darwin-x64
          - os: ubuntu-latest
            target: bun-windows-x64
            binary: firecrawl-windows-x64.exe

    runs-on: ${{ matrix.os }}
    name: Build ${{ matrix.binary }}
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Build binary
        run: bun build src/index.ts --compile --target=${{ matrix.target }} --outfile ${{ matrix.binary }}

      - name: Create tarball (Unix)
        if: "!contains(matrix.binary, 'windows')"
        run: tar -czf ${{ matrix.binary }}.tar.gz ${{ matrix.binary }}

      - name: Create zip (Windows)
        if: contains(matrix.binary, 'windows')
        run: zip ${{ matrix.binary }}.zip ${{ matrix.binary }}

      - name: Upload binary artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.binary }}
          path: |
            ${{ matrix.binary }}
            ${{ matrix.binary }}.tar.gz
            ${{ matrix.binary }}.zip
          if-no-files-found: ignore

  package:
    needs: [check-version, build]
    runs-on: ubuntu-latest
    name: Package release assets
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts

      - name: Collect release files
        run: |
          mkdir -p release binaries
          find artifacts -type f \( -name "*.tar.gz" -o -name "*.zip" \) -exec cp {} release/ \;
          # Copy raw binaries for nfpm packaging
          for dir in artifacts/firecrawl-linux-*/; do
            find "$dir" -type f ! -name "*.tar.gz" ! -name "*.zip" -exec cp {} binaries/ \;
          done
          chmod +x binaries/*
          ls -la release/
          ls -la binaries/

      - name: Install nfpm
        env:
          NFPM_VERSION: 2.48.0
          NFPM_SHA256: 6d7f9a28b2f397934403950fcbba83f598b08d02edbe79a0815b3b4897341750
        run: |
          curl -sfL -o "$RUNNER_TEMP/nfpm.tar.gz" "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz"
          echo "${NFPM_SHA256}  $RUNNER_TEMP/nfpm.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/nfpm.tar.gz" -C /usr/local/bin nfpm
          nfpm --version

      - name: Build Linux packages
        run: |
          VERSION="${{ needs.check-version.outputs.version }}"

          # linux amd64
          export BINARY=binaries/firecrawl-linux-x64 VERSION="$VERSION" ARCH=amd64
          envsubst < nfpm.yaml > /tmp/nfpm-amd64.yaml
          for fmt in deb rpm apk archlinux; do
            nfpm package --config /tmp/nfpm-amd64.yaml --packager "$fmt" --target release/
          done

          # linux arm64
          export BINARY=binaries/firecrawl-linux-arm64 ARCH=arm64
          envsubst < nfpm.yaml > /tmp/nfpm-arm64.yaml
          for fmt in deb rpm apk archlinux; do
            nfpm package --config /tmp/nfpm-arm64.yaml --packager "$fmt" --target release/
          done

          ls -la release/

      - name: Generate checksums
        run: |
          cd release
          sha256sum * > checksums.txt
          cat checksums.txt

      - name: Summary (dry run)
        if: needs.check-version.outputs.dry_run == 'true'
        run: |
          echo "## Dry Run — Release v${{ needs.check-version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All artifacts built and packaged successfully:" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          ls -lh release/ >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**No release created — this is a dry run on branch \`${{ github.ref_name }}\`.**" >> $GITHUB_STEP_SUMMARY

      - name: Upload release assets
        if: needs.check-version.outputs.dry_run != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: release
          if-no-files-found: error
          retention-days: 7

  supersede:
    name: Supersede unapproved runs
    needs: check-version
    if: needs.check-version.outputs.released == 'false' && needs.check-version.outputs.dry_run != 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        continue-on-error: true
        with:
          sparse-checkout: .github/actions
          persist-credentials: false
      - uses: ./.github/actions/supersede-waiting-runs
        continue-on-error: true
        timeout-minutes: 2

  release-summary:
    name: Release summary
    needs: check-version
    if: needs.check-version.outputs.released == 'false' && needs.check-version.outputs.dry_run != 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        continue-on-error: true
        with:
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false
      - uses: ./.github/actions/release-summary
        continue-on-error: true
        timeout-minutes: 3
        with:
          gated-job: Create release and upload assets
          version: v${{ needs.check-version.outputs.version }}

  release:
    needs: [check-version, package, release-summary]
    if: needs.check-version.outputs.dry_run != 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    name: Create release and upload assets
    environment: release
    concurrency:
      group: ${{ github.workflow }}-release-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
      attestations: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - name: Download release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: release

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/*

      - name: Generate release notes
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            git log --pretty=format:"- %s" "$PREV_TAG..HEAD" -- | head -50 > /tmp/release-notes.md
          else
            echo "Initial release" > /tmp/release-notes.md
          fi

      - name: Create tag and GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="v${{ needs.check-version.outputs.version }}"
          git tag "$VERSION"
          git push origin "$VERSION"
          gh release create "$VERSION" release/* \
            --repo "${{ github.repository }}" \
            --title "Firecrawl CLI $VERSION" \
            --notes-file /tmp/release-notes.md
